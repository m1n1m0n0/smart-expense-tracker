<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker (v2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Smart Expense Tracker</h1>

    <!-- novalidate: our JavaScript shows the error messages instead of the browser -->
    <form id="expense-form" novalidate>
      <label for="expense-name">Expense name</label>
      <input type="text" id="expense-name" placeholder="e.g. Lunch">

      <label for="expense-amount">Amount ($)</label>
      <input type="number" id="expense-amount" step="0.01" placeholder="e.g. 12.50">

      <label for="expense-category">Category</label>
      <select id="expense-category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Other">Other</option>
      </select>

      <button type="submit">Add expense</button>
    </form>

    <!-- Validation messages appear here (empty = hidden) -->
    <p id="message" class="message" role="alert"></p>

    <p class="total">Total spent: <span id="total-amount">$0.00</span></p>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
